# SSH client defaults — managed by workbench-ssh
# File: ~/.ssh/config.d/00-defaults.conf
# Placed here by hooks/post-deploy.sh, re-copied on every module update
# (run_on: changed) — do not hand-edit; add per-host overrides in a
# higher-numbered config.d file instead (see this repo's README).
#
# Settings under `Host *` here are included before your own config, so they
# win over later per-host blocks for the same keyword (ssh uses the first
# value it finds). This file deliberately sets only defaults that are safe
# everywhere.

Host workbench-*
    ControlMaster no
    ControlPersist no
    ControlPath none

# ── Connection multiplexing — forges only (security review M8) ────────────────
# A multiplexed master lets any local process open new sessions without
# re-authenticating, bypassing FIDO2 touch, ssh-add -c confirmation and MFA.
# Enabled only for the Git forges, where fast repeated git operations benefit
# most. Opt a host in yourself in a later config.d file:
#   Host myhost
#       ControlMaster auto
#       ControlPath ~/.ssh/cm_sockets/%C
#       ControlPersist 10m
Host github.com gitlab.com bitbucket.org
    ControlMaster auto
    ControlPath ~/.ssh/cm_sockets/%C
    ControlPersist 10m

Host *
    # ── Connection keepalive ──────────────────────────────────────────────────
    # Send a keepalive every 60s; disconnect after 3 missed responses (3min).
    # Prevents idle session timeouts on firewalled or NAT'd connections.
    ServerAliveInterval 60
    ServerAliveCountMax 3

    # ── Known hosts ───────────────────────────────────────────────────────────
    # The second file holds the forge host keys pinned by workbench-ssh
    # (security review H2). ssh writes newly accepted keys only to the first.
    # UpdateHostKeys is set explicitly because overriding UserKnownHostsFile
    # turns off its default.
    UserKnownHostsFile ~/.ssh/known_hosts ~/.ssh/known_hosts.d/workbench-forges
    UpdateHostKeys yes

    # ── Key negotiation preferences ───────────────────────────────────────────
    # Prefer modern key types. The sk- entries are FIDO2 hardware-backed keys;
    # without them this list silently refuses to use a hardware key.
    HostKeyAlgorithms ssh-ed25519,ecdsa-sha2-nistp256,rsa-sha2-512,rsa-sha2-256
    PubkeyAcceptedAlgorithms sk-ssh-ed25519@openssh.com,sk-ecdsa-sha2-nistp256@openssh.com,ssh-ed25519,ecdsa-sha2-nistp256,rsa-sha2-512,rsa-sha2-256

    # ── Security defaults ─────────────────────────────────────────────────────
    # Do not forward the SSH agent by default. Enable per-host when needed.
    # Forwarding to an untrusted host allows that host to use your keys.
    ForwardAgent no

    # Do not forward X11 by default. Enable per-host when needed.
    ForwardX11 no

    # Hash known_hosts entries so hostnames are not trivially enumerable.
    HashKnownHosts yes

    # ── Usability ─────────────────────────────────────────────────────────────
    # Suppress the banner and noise; errors still appear.
    LogLevel ERROR

    # Reuse TCP connection (keep-alive at the TCP layer as well).
    TCPKeepAlive yes
