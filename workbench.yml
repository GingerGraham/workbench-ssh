# workbench.yml — workbench-ssh
#
# Ecosystem module (workbench-core ARCHITECTURE.md §2/§3): opinionated SSH
# client layer — hardened defaults, agent routing scaffold, pinned
# forge host keys. Requires workbench-core only — works without any other
# workbench module. The bootstrap-critical deploy-key/
# alias mechanics (10-workbench.conf) stay in workbench-core itself
# (lib/ssh/bootstrap.sh, ARCHITECTURE.md D1) — not part of this module.
#
# See contracts/manifest-spec.md (in workbench-core) for the full field
# reference.
version: 2
branch: main

core_api: ">=1.8 <2.0"
sync:
  enabled: true

info:
  description: "Hardened SSH client config, agent routing, and pinned forge host keys"

deploy:
  # Pinned forge host keys, referenced by files/00-defaults.conf's
  # UserKnownHostsFile. The module's own files/ path is the one place under
  # ~/.local/share/workbench/ a module may deploy to.
  - src: files/known_hosts.forges
    dest: ~/.local/share/workbench/modules/ssh/files/known_hosts.forges
    mode: copy
    lifecycle: generated
  # Template for ssh-agent-scaffold (shell/ssh.sh) to copy from.
  - src: files/01-agent.conf
    dest: ~/.local/share/workbench/modules/ssh/files/01-agent.conf
    mode: copy
    lifecycle: generated

register:
  shell:
    - src: shell/ssh.sh
      tier: tools
  getters:
    - name: ssh
      function: get-ssh-functions
      label: "SSH agent and host-listing helpers"

layers:
  # Hardened defaults, included at the end of ~/.ssh/config: ssh takes the
  # first value it finds, so anything you've set wins.
  - tool: ssh_config
    src: files/00-defaults.conf
    adopt: [files/legacy/ssh-defaults-include]
  # Your ~/.ssh/config.d/*.conf files, included at the top so they win.
  - tool: ssh_config
    src: files/ssh_config-confd
    position: over
